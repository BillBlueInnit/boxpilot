[package]
name = "boxpilot"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A clean sing-box client with a built-in subscription converter"

[dependencies]
boxpilot-core = { path = "../core" }
gpui-kit = "0.8"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
log.workspace = true
chrono = "0.4"
tray-icon = { version = "0.26", default-features = false }
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_System_LibraryLoader",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The Linux tray is an AppIndicator driven by a GTK main loop.
[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["libappindicator"] }
gtk = "0.18"

[build-dependencies]
winresource = "0.1"
