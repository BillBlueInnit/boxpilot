[package]
name = "boxpilot-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
log.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["socks", "stream", "gzip", "brotli", "deflate", "json", "charset", "http2"] }
futures-util = "0.3"
serde_yaml_ng = "0.10"
base64 = "0.22"
percent-encoding = "2"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
maxminddb = "0.26"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# TLS: the OS stack on Windows (SChannel) and Apple platforms (Security.framework);
# rustls with the system certificate store on Linux, so no libssl is needed.
# Android (boxpilot-mobile) has no certificate store a native library can read,
# so it uses rustls with the bundled Mozilla roots.
[target.'cfg(any(windows, target_os = "macos", target_os = "ios"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["default-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }

[target.'cfg(not(any(windows, target_os = "macos", target_os = "ios", target_os = "android")))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Networking_WinInet",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
