# Publishes a GitHub Release when a version tag is pushed:
#   git tag v0.2.0 && git push origin v0.2.0
# The tag must match the workspace version in Cargo.toml. Asset names are what
# the in-app updater looks for: BoxPilot-<version>-<platform>.<zip|tar.gz>;
# macOS also gets a .dmg with BoxPilot.app to drag into Applications, and Linux
# a .deb and an .rpm. With an AUR_SSH_PRIVATE_KEY secret, the AUR packages
# (boxpilot-bin, boxpilot) are updated to the new release afterwards.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.2.0
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest, platform: windows-x64, ext: zip }
          - { name: macOS arm64, os: macos-14, platform: macos-arm64, ext: tar.gz }
          - { name: macOS x64, os: macos-15-intel, platform: macos-x64, ext: tar.gz }
          - { name: Linux x64, os: ubuntu-24.04, platform: linux-x64, ext: tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev \
            libfontconfig-dev libfreetype-dev libvulkan-dev libpipewire-0.3-dev \
            libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      - name: Tag matches the crate version
        shell: bash
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)
          echo "Cargo.toml: $version, tag: $TAG"
          test "v$version" = "$TAG"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked -p boxpilot

      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: cargo install --locked cargo-deb cargo-generate-rpm

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="BoxPilot-${VERSION}-${{ matrix.platform }}"
          mkdir pkg out
          cp LICENSE README.md pkg/
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/boxpilot.exe pkg/
            pwsh -NoProfile -Command "Compress-Archive -Path pkg/* -DestinationPath 'out/$name.zip'"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            # A real app bundle: Dock icon, Launchpad, drag-to-Applications install.
            app=pkg/BoxPilot.app
            mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
            cp target/release/boxpilot "$app/Contents/MacOS/"
            chmod +x "$app/Contents/MacOS/boxpilot"
            sed "s/@VERSION@/$VERSION/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
            cargo run --release --locked -p boxpilot --example icns -- "$app/Contents/Resources/BoxPilot.icns"
            codesign --force --deep --sign - "$app"
            # The updater reads this archive (it takes Contents/MacOS/boxpilot).
            tar -czf "out/$name.tar.gz" -C pkg .
            mkdir dmg
            cp -R "$app" dmg/
            ln -s /Applications dmg/Applications
            hdiutil create -volname BoxPilot -srcfolder dmg -ov -format UDZO "out/$name.dmg"
          else
            # The archive (with the desktop entry and icons), .deb and .rpm.
            packaging/linux/build.sh tar deb rpm
            cp dist/* out/
          fi
          ls -la out

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: BoxPilot ${{ env.TAG }}
          generate_release_notes: true
          files: dist/*

  # Pushes the AUR recipes in packaging/aur for this release, so
  # `yay -S boxpilot-bin` (prebuilt) or `yay -S boxpilot` (from source) get it.
  # Needs the AUR_SSH_PRIVATE_KEY secret: the private half of an SSH key whose
  # public half is on your AUR account. Without it the job does nothing.
  aur:
    needs: publish
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        pkg: [boxpilot-bin, boxpilot]
    env:
      AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - name: Skip without an AUR key
        if: env.AUR_KEY == ''
        run: echo "No AUR_SSH_PRIVATE_KEY secret; the AUR is not updated."

      - uses: actions/checkout@v7
        if: env.AUR_KEY != ''
        with:
          ref: ${{ env.TAG }}

      - name: Publish ${{ matrix.pkg }}
        if: env.AUR_KEY != ''
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed git openssh
          # makepkg refuses to run as root.
          useradd -m builder
          install -d -m 700 -o builder -g builder /home/builder/.ssh
          printf '%s\n' "$AUR_KEY" > /home/builder/.ssh/aur
          ssh-keyscan -t ed25519,rsa aur.archlinux.org > /home/builder/.ssh/known_hosts
          printf 'Host aur.archlinux.org\n  User aur\n  IdentityFile ~/.ssh/aur\n' > /home/builder/.ssh/config
          chown -R builder:builder /home/builder/.ssh "$GITHUB_WORKSPACE"
          chmod 600 /home/builder/.ssh/*
          su builder -c "cd '$GITHUB_WORKSPACE' && packaging/aur/publish.sh ${{ matrix.pkg }} '$TAG'"
