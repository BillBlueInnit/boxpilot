# Publishes a GitHub Release when a version tag is pushed:
#   git tag v0.2.0 && git push origin v0.2.0
# The tag must match the workspace version in Cargo.toml. Asset names are what
# the in-app updater looks for: BoxPilot-<version>-<platform>.<zip|tar.gz>.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.2.0
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest, platform: windows-x64, ext: zip }
          - { name: macOS arm64, os: macos-14, platform: macos-arm64, ext: tar.gz }
          - { name: macOS x64, os: macos-15-intel, platform: macos-x64, ext: tar.gz }
          - { name: Linux x64, os: ubuntu-24.04, platform: linux-x64, ext: tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev \
            libfontconfig-dev libfreetype-dev libvulkan-dev libpipewire-0.3-dev \
            libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      - name: Tag matches the crate version
        shell: bash
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)
          echo "Cargo.toml: $version, tag: $TAG"
          test "v$version" = "$TAG"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked -p boxpilot

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="BoxPilot-${VERSION}-${{ matrix.platform }}"
          mkdir pkg
          cp LICENSE README.md pkg/
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/boxpilot.exe pkg/
            pwsh -NoProfile -Command "Compress-Archive -Path pkg/* -DestinationPath '$name.zip'"
          else
            cp target/release/boxpilot pkg/
            chmod +x pkg/boxpilot
            tar -czf "$name.tar.gz" -C pkg .
          fi
          echo "ASSET=$name.${{ matrix.ext }}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: BoxPilot ${{ env.TAG }}
          generate_release_notes: true
          files: dist/*
