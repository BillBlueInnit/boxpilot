# Checks the two ways traffic reaches BoxPilot on real machines — the system
# proxy and TUN — with an ordinary client and a local node (see
# crates/core/examples/platform_live.rs). Only the core is built, so a round
# takes minutes. Runs for changes to the parts it covers and on demand.
name: Live proxy test

on:
  push:
    branches: [main, 'live/**']
    paths:
      - 'crates/core/**'
      - '.github/workflows/live.yml'
  workflow_dispatch:

concurrency:
  group: live-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  live:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-14, singbox: darwin-arm64, ext: tar.gz }
          - { name: macOS x64, os: macos-15-intel, singbox: darwin-amd64, ext: tar.gz }
          - { name: Windows x64, os: windows-latest, singbox: windows-amd64, ext: zip }
          - { name: Linux x64, os: ubuntu-24.04, singbox: linux-amd64, ext: tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build the live test
        run: cargo build --release --locked -p boxpilot-core --example platform_live

      - name: Download the sing-box core
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/SagerNet/sing-box/releases/latest | sed -n 's/.*"tag_name": *"v\{0,1\}\([^"]*\)".*/\1/p')
          name="sing-box-${tag}-${{ matrix.singbox }}"
          curl -fsSL -o "core.${{ matrix.ext }}" \
            "https://github.com/SagerNet/sing-box/releases/download/v${tag}/${name}.${{ matrix.ext }}"
          mkdir core
          if [ "${{ matrix.ext }}" = "zip" ]; then unzip -q core.zip -d core; else tar -xzf core.tar.gz -C core; fi
          bin=$(find "$PWD/core" -type f \( -name sing-box -o -name sing-box.exe \) | head -n1)
          chmod +x "$bin"
          echo "SING_BOX=$bin" >> "$GITHUB_ENV"

      - name: System proxy
        if: runner.os != 'Linux'
        shell: bash
        run: ./target/release/examples/platform_live "$SING_BOX" "$RUNNER_TEMP/live-sysproxy" sysproxy

      - name: System proxy (Linux, desktop settings read through GIO)
        # A session bus with dconf stands in for the desktop session.
        if: runner.os == 'Linux' && (success() || failure())
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-glib-2.0 glib-networking gsettings-desktop-schemas dconf-gsettings-backend dconf-service dbus
          XDG_CURRENT_DESKTOP=GNOME dbus-run-session -- \
            ./target/release/examples/platform_live "$SING_BOX" "$RUNNER_TEMP/live-sysproxy" sysproxy

      - name: TUN
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          core="$RUNNER_TEMP/tun-core/$(basename "$SING_BOX")"
          mkdir -p "$(dirname "$core")"
          cp "$SING_BOX" "$core"
          # What BoxPilot's one-time TUN permission does on each system.
          case "${{ runner.os }}" in
            macOS) sudo chown root:wheel "$core" && sudo chmod u+s "$core" ;;
            Linux) sudo setcap cap_net_admin,cap_net_bind_service+ep "$core" ;;
          esac
          echo "TUN_CORE=$core" >> "$GITHUB_ENV"
          ./target/release/examples/platform_live "$core" "$RUNNER_TEMP/live-tun" tun

      - name: TUN with a setuid core (Linux without setcap)
        # BoxPilot's fallback when libcap's setcap is not installed.
        if: runner.os == 'Linux' && (success() || failure())
        shell: bash
        run: |
          set -euo pipefail
          core="$RUNNER_TEMP/tun-suid/sing-box"
          mkdir -p "$(dirname "$core")"
          cp "$SING_BOX" "$core"
          sudo chown root:root "$core" && sudo chmod u+s "$core"
          ./target/release/examples/platform_live "$core" "$RUNNER_TEMP/live-tun-suid" tun

      - name: TUN with the DNS server on the LAN (macOS)
        # Home networks hand out the router as DNS. Its subnet route is more
        # specific than TUN's, so queries must still be made to reach the core.
        # An unused address on the runner's own subnet stands in for it.
        if: runner.os == 'macOS' && (success() || failure())
        shell: bash
        run: |
          set -euo pipefail
          gw=$(route -n get default | awk '/gateway:/{print $2}')
          dns="${gw%.*}.250"
          echo "gateway $gw, LAN DNS stand-in $dns"
          networksetup -listallnetworkservices | tail -n +2 | grep -v '^\*' > services.txt
          while read -r svc; do sudo networksetup -setdnsservers "$svc" "$dns"; done < services.txt
          sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder || true
          scutil --dns | grep -m2 nameserver || true
          status=0
          ./target/release/examples/platform_live "$TUN_CORE" "$RUNNER_TEMP/live-tun-lan" tun || status=$?
          echo "DNS after the test:"; while read -r svc; do networksetup -getdnsservers "$svc"; done < services.txt
          while read -r svc; do sudo networksetup -setdnsservers "$svc" Empty; done < services.txt
          exit $status

      - name: TUN with the DNS server on the LAN (Linux)
        if: runner.os == 'Linux' && (success() || failure())
        shell: bash
        run: |
          set -euo pipefail
          iface=$(ip route show default | awk '{print $5; exit}')
          gw=$(ip route show default | awk '{print $3; exit}')
          dns="${gw%.*}.250"
          echo "gateway $gw on $iface, LAN DNS stand-in $dns"
          ip route show | head -5
          sudo resolvectl dns "$iface" "$dns"
          sudo resolvectl domain "$iface" '~.'
          sudo resolvectl flush-caches
          resolvectl status "$iface" | grep -i 'dns server' || true
          status=0
          ./target/release/examples/platform_live "$TUN_CORE" "$RUNNER_TEMP/live-tun-lan" tun || status=$?
          sudo resolvectl revert "$iface"
          exit $status

      - name: TUN with the DNS server on the LAN (Windows)
        if: runner.os == 'Windows' && (success() || failure())
        shell: pwsh
        run: |
          $r = Get-NetRoute -DestinationPrefix 0.0.0.0/0 | Sort-Object RouteMetric | Select-Object -First 1
          $dns = $r.NextHop -replace '\.\d+$', '.250'
          "gateway $($r.NextHop) on $($r.InterfaceAlias), LAN DNS stand-in $dns"
          Set-DnsClientServerAddress -InterfaceIndex $r.ifIndex -ServerAddresses $dns
          Clear-DnsClientCache
          ./target/release/examples/platform_live.exe "$env:TUN_CORE" "$env:RUNNER_TEMP/live-tun-lan" tun
          $status = $LASTEXITCODE
          Set-DnsClientServerAddress -InterfaceIndex $r.ifIndex -ResetServerAddresses
          exit $status

      - uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: live-${{ matrix.singbox }}
          path: |
            ${{ runner.temp }}/live-*/core.log
            ${{ runner.temp }}/live-*/node.log
            ${{ runner.temp }}/live-*/data/run/config.json
          if-no-files-found: ignore
